name: CI/CD Pipeline - Portfolio

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend CI: Dependencies and syntax verification
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Verify Syntax
        working-directory: ./backend
        run: |
          node --check src/server.js
          node --check src/app.js

  # Frontend CI: Dependencies and production build
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Production Bundle
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://api.momin-portfolio.placeholder
        run: npm run build

      - name: Verify Build Artifacts
        working-directory: ./frontend
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html not found. Build failed."
            exit 1
          fi

  # Deploy Backend to Render
  deploy-backend:
    name: Deploy Backend (Render)
    needs: [backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Render deployment..."
            response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
            http_code=$(echo "$response" | tail -n1)
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Render deployment triggered successfully (HTTP $http_code)."
            else
              echo "Warning: Render deploy hook returned HTTP $http_code."
            fi
          else
            echo "RENDER_DEPLOY_HOOK_URL not configured. Relying on Render Git Auto-Deploy."
          fi

  # Deploy Frontend to Vercel
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: [frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Deploying to Vercel production..."
            npx --yes vercel --token "${{ secrets.VERCEL_TOKEN }}" --prod --yes ./frontend
          else
            echo "VERCEL_TOKEN not configured. Relying on Vercel Git Auto-Deploy."
          fi
